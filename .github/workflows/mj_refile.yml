name: MidJourney File Processor

on:
  schedule:
    - cron: "0 17 * * *" # 每天UTC 17:00 (北京时间凌晨1:00)
  workflow_dispatch: # 允许手动触发

jobs:
  process:
    runs-on: ubuntu-latest

    env:
      INPUT_DIR: "./output/mj-linkdoc"
      OUTPUT_DIR: "./output/mj-linkdoc-output"
      JSON_OUTPUT_DIR: "./output/mj-linkdoc-json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run file processor
        run: python mj_refile.py

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Commit and push if there are changes
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Process MidJourney files - $(date +'%Y-%m-%d %H:%M:%S')" && git push)
