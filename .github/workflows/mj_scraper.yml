name: MidJourney Scraper

on:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时运行一次
  workflow_dispatch:  # 允许手动触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    env:
      OUTPUT_FOLDER: './output/mj-linkdoc'
      LOG_FOLDER: './logs'
      SCRAPE_INTERVAL_SECONDS: '7200'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager
          
      - name: Run scraper (single mode)
        run: python mj_scraper.py --single
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Commit and push if there are changes
        run: |
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update MidJourney data - $(date +'%Y-%m-%d %H:%M:%S')" && git push)